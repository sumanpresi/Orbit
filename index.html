<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orbit</title>
  <meta name="description" content="Your links, on your schedule." />
  <meta name="theme-color" content="#07080d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <!-- ── Sign in ─────────────────────────────── -->
  <section id="auth" class="screen" hidden>
    <div class="auth-card glass">
      <div class="logo-lg"><span class="ring"></span><span class="core"></span></div>
      <h1>Orbit</h1>
      <p class="muted">Your links, on your schedule. Synced everywhere you sign in.</p>
      <button id="btn-google" class="btn primary wide">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3zM12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22zM6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14zM12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z"/></svg>
        Continue with Google
      </button>
      <div class="or"><span>or</span></div>
      <form id="form-email" class="row">
        <input id="email" type="email" placeholder="you@email.com" autocomplete="email" required />
        <button class="btn">Email link</button>
      </form>
      <p id="auth-msg" class="muted small"></p>
    </div>
  </section>

  <!-- ── App ─────────────────────────────────── -->
  <section id="app" class="screen" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="logo"><span class="ring"></span><span class="core"></span></div>
        <div>
          <div class="title">Orbit</div>
          <div class="sub"><span id="sync-dot" class="dot"></span><span id="sync-text">Syncing…</span></div>
        </div>
      </div>
      <div class="top-actions">
        <button id="btn-push" class="chip" title="Notifications on this device">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>
          <span id="push-label">Enable alerts</span>
        </button>
        <button id="btn-menu" class="icon-btn" aria-label="Account">
          <span id="avatar" class="avatar">•</span>
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search glass">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 4a6 6 0 1 0 3.7 10.7l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
        <input id="search" placeholder="Search links" />
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <main id="list" class="grid" aria-live="polite"></main>

    <div id="empty" class="empty" hidden>
      <div class="logo-lg dim"><span class="ring"></span><span class="core"></span></div>
      <h2>Nothing in orbit yet</h2>
      <p class="muted">Add a link, then tap its bell to decide when it should come back to you.</p>
    </div>

    <button id="fab" class="fab" aria-label="Add link">
      <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>
  </section>

  <!-- ── Sheet: add / edit link ──────────────── -->
  <div id="sheet-link" class="sheet-wrap" hidden>
    <div class="scrim" data-close></div>
    <form class="sheet glass" id="form-link">
      <div class="grab"></div>
      <h3 id="link-title">Add link</h3>
      <label>Name<input id="f-name" maxlength="80" placeholder="e.g. Weekly report" required /></label>
      <label>URL<input id="f-url" inputmode="url" placeholder="https://docs.google.com/…" required /></label>
      <p class="muted small" id="f-app-hint"></p>
      <div class="sheet-actions">
        <button type="button" class="btn ghost danger" id="btn-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button class="btn primary">Save</button>
      </div>
    </form>
  </div>

  <!-- ── Sheet: schedule ─────────────────────── -->
  <div id="sheet-sched" class="sheet-wrap" hidden>
    <div class="scrim" data-close></div>
    <form class="sheet glass" id="form-sched">
      <div class="grab"></div>
      <div class="sheet-head">
        <div>
          <h3>Reminder</h3>
          <div class="muted small" id="s-for"></div>
        </div>
        <label class="switch"><input type="checkbox" id="s-enabled" checked /><span></span></label>
      </div>

      <div class="seg" id="s-freq" role="tablist">
        <button type="button" data-f="minute">Minute</button>
        <button type="button" data-f="hourly">Hourly</button>
        <button type="button" data-f="daily">Daily</button>
        <button type="button" data-f="weekly">Weekly</button>
        <button type="button" data-f="monthly">Monthly</button>
        <button type="button" data-f="yearly">Yearly</button>
      </div>

      <div class="fields">
        <label class="f-every">Every
          <div class="stepper">
            <button type="button" data-step="-1">−</button>
            <input id="s-every" type="number" min="1" max="999" value="1" />
            <button type="button" data-step="1">+</button>
            <span id="s-unit" class="muted">day</span>
          </div>
        </label>
        <label class="f-minute">At minute<input id="s-minute" type="number" min="0" max="59" value="0" /></label>
        <label class="f-weekdays">On
          <div class="weekdays" id="s-weekdays">
            <button type="button" data-d="1">M</button><button type="button" data-d="2">T</button><button type="button" data-d="3">W</button><button type="button" data-d="4">T</button><button type="button" data-d="5">F</button><button type="button" data-d="6">S</button><button type="button" data-d="7">S</button>
          </div>
        </label>
        <label class="f-month">Month
          <select id="s-month">
            <option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option>
          </select>
        </label>
        <label class="f-day">Day of month<input id="s-day" type="number" min="1" max="31" value="1" /></label>
        <label class="f-time">Time<input id="s-time" type="time" value="09:00" /></label>
        <label class="f-msg">Note in notification <span class="muted">(optional)</span><input id="s-msg" maxlength="120" placeholder="e.g. Update the numbers" /></label>
        <details class="quiet">
          <summary>Quiet hours</summary>
          <div class="row">
            <label>From<input id="s-q1" type="time" /></label>
            <label>To<input id="s-q2" type="time" /></label>
          </div>
          <p class="muted small">Reminders that land inside this window are skipped.</p>
        </details>
      </div>

      <div class="preview glass-2">
        <div class="muted small">Next reminders</div>
        <ol id="s-preview"></ol>
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="btn-test">Send test</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button class="btn primary">Save</button>
      </div>
    </form>
  </div>

  <!-- ── Menu ────────────────────────────────── -->
  <div id="sheet-menu" class="sheet-wrap" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet glass">
      <div class="grab"></div>
      <div class="muted small" id="m-email"></div>
      <div class="menu">
        <button class="btn ghost wide" id="m-devices">This device: <span id="m-dev-state"></span></button>
        <button class="btn ghost wide" id="m-signout">Sign out</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
